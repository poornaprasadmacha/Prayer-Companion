<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A" />
      <stop offset="60%" stop-color="#005B99" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>

    <!-- Praying Hands Gradient -->
    <linearGradient id="handsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Golden Radiant Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Halo Ring -->
  <circle cx="256" cy="210" r="145" fill="none" stroke="#38BDF8" stroke-width="4" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="210" r="125" fill="rgba(56, 189, 248, 0.08)" stroke="#FDE047" stroke-width="2.5" opacity="0.6" />

  <!-- Praying Hands Vector Motif -->
  <g transform="translate(146, 85)" filter="url(#softGlow)">
    <!-- Left Hand Silhouette -->
    <path d="M 110 50 
             C 105 40, 95 38, 88 45 
             C 80 52, 82 66, 85 85 
             L 92 135 
             C 93 145, 90 155, 82 165 
             L 60 195 
             C 52 205, 50 215, 54 225 
             L 68 255 
             C 74 266, 88 270, 98 265 
             L 110 260 Z" 
          fill="url(#handsGrad)" opacity="0.95" />

    <!-- Right Hand Silhouette (Mirror Interlocking) -->
    <path d="M 110 50 
             C 115 40, 125 38, 132 45 
             C 140 52, 138 66, 135 85 
             L 128 135 
             C 127 145, 130 155, 138 165 
             L 160 195 
             C 168 205, 170 215, 166 225 
             L 152 255 
             C 146 266, 132 270, 122 265 
             L 110 260 Z" 
          fill="url(#handsGrad)" />

    <!-- Palm Center Seam & Fingers Outline -->
    <path d="M 110 48 L 110 260" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    <path d="M 98 90 C 104 88, 116 88, 122 90" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 94 125 C 102 122, 118 122, 126 125" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 90 160 C 100 157, 120 157, 130 160" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Divine Golden Light Radiance Rays -->
    <line x1="110" y1="25" x2="110" y2="5" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="35" x2="68" y2="20" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" />
    <line x1="140" y1="35" x2="152" y2="20" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- PRAY Executive Bold Typography at Base -->
  <g transform="translate(256, 425)">
    <!-- Subtle Text Shadow -->
    <text text-anchor="middle" y="2" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" 
          font-size="44" font-weight="900" letter-spacing="8" fill="rgba(2, 62, 138, 0.45)">
      PRAY
    </text>
    <!-- Crisp White Foreground Text -->
    <text text-anchor="middle" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" 
          font-size="44" font-weight="900" letter-spacing="8" fill="#FFFFFF">
      PRAY
    </text>
    <!-- Underline Accent Pip -->
    <circle cx="0" cy="18" r="3.5" fill="#38BDF8" />
  </g>
</svg>
